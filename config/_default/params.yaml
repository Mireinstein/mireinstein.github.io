hugoblox:
  schema: "2.0"

  identity:
    name: "Admire Madyira"
    organization: ""
    type: person
    tagline: "Software Engineer · AI/ML"
    description: "Software Engineer at Microsoft AI. Building things that matter."
    social:
      twitter: ""

  theme:
    mode: system
    pack: "default"
    colors:
      primary: ""
      secondary: ""
      neutral: ""

  typography:
    font: "sans"
    size: "md"

  layout:
    radius: "md"
    spacing: "comfortable"
