    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} {name}"

  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false

  search:
    enable: true

  comments:
    enable: false

  analytics:
    google:
      measurement_id: ""

  privacy:
    enable: false

  debug:
    enable: false
