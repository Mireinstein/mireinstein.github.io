bio: >
  Hi, I'm Admire — a dedicated problem solver with a deep fascination for how
  systems are built, optimized, and pushed to their limits. My background is
  in DevOps — building and maintaining the release, update, and deployment
  infrastructure that delivers Copilot, Edge, and WebView2 to billions of
  users worldwide. I also have experience in artificial intelligence and
  machine learning — researching Copilot safety, reliability, and robustness
  to malicious attacks like prompt injection. In every team I've worked with, I've been praised for
  two things: being a quick learner and getting things done.

